name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: retailbooks
          POSTGRES_USER: retailbooks
          POSTGRES_PASSWORD: retailbooks
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check migration drift
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://retailbooks:retailbooks@localhost:5432/retailbooks
          SHADOW_DATABASE_URL: postgresql://retailbooks:retailbooks@localhost:5432/retailbooks_shadow
        run: |
          psql "$DATABASE_URL" -c 'CREATE DATABASE retailbooks_shadow'
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$SHADOW_DATABASE_URL" --exit-code

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate Docker Compose
        run: docker compose config --quiet
